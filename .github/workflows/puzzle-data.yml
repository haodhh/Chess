name: Build puzzle data

# Downloads the Lichess puzzle database (CC0), samples it into rating shards
# under public/data/puzzles and commits the result to the branch it ran on.
on:
  workflow_dispatch:
    inputs:
      per_band:
        description: Puzzles per 100-point rating band
        default: '2500'

permissions:
  contents: write
  actions: write

concurrency:
  group: puzzle-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download and build shards
        env:
          PER_BAND: ${{ inputs.per_band }}
        run: |
          set -o pipefail
          curl -fsSL --retry 3 https://database.lichess.org/lichess_db_puzzle.csv.zst \
            | zstd -dc \
            | node scripts/build-puzzles.mjs
          du -sh public/data/puzzles
      - name: Commit data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/puzzles
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update puzzle data from the Lichess puzzle database"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Redeploy site
        # Pushes made with GITHUB_TOKEN do not trigger other workflows, so start the deploy explicitly.
        if: steps.commit.outputs.changed == 'true' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh workflow view deploy.yml > /dev/null 2>&1; then
            gh workflow run deploy.yml --ref "${{ github.ref_name }}"
          fi
